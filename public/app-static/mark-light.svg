<svg width="200" height="200" viewBox="38 38 124 124" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fadeGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#087060;stop-opacity:1"></stop>
      <stop offset="70%" style="stop-color:#087060;stop-opacity:0.9"></stop>
      <stop offset="100%" style="stop-color:#087060;stop-opacity:0"></stop>
    </radialGradient>
    <mask id="fadeMask">
      <circle cx="100" cy="100" r="60" fill="url(#fadeGradient)"></circle>
    </mask>
  </defs>

  
  <rect width="200" height="200" fill="none"></rect>

  
  <g mask="url(#fadeMask)">
    
    <circle cx="50" cy="80" r="6.5" fill="#087060"></circle>
    <circle cx="80" cy="100" r="6.5" fill="#087060"></circle>
    <circle cx="100" cy="80" r="6.5" fill="#087060"></circle>
    <circle cx="120" cy="100" r="6.5" fill="#087060"></circle>
    <circle cx="150" cy="80" r="6.5" fill="#087060"></circle>

    
    <line x1="50" y1="80" x2="80" y2="100" stroke="#087060" stroke-width="3.2" stroke-linecap="round"></line>
    <line x1="80" y1="100" x2="100" y2="80" stroke="#087060" stroke-width="3.2" stroke-linecap="round"></line>
    <line x1="100" y1="80" x2="120" y2="100" stroke="#087060" stroke-width="3.2" stroke-linecap="round"></line>
    <line x1="120" y1="100" x2="150" y2="80" stroke="#087060" stroke-width="3.2" stroke-linecap="round"></line>
